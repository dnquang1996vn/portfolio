<!doctype html>
<!--
  Source for the blog cover images in public/images/cover-*.png (1800x1200, 3:2).
  Each <svg id="cN"> is one cover; open this file in a browser and screenshot the element,
  or with playwright: page.locator('#c1').screenshot({ path: 'cover-multi-tenant.png' }).
  Keep the main content between y=214 and y=986 so it survives the 21:9 crop on article pages.
  c1 multi-tenant · c2 soap-hipaa · c3 agentic-workflows · c4 25-regulators · c5 data-tables · c6 estimating
-->
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff}
  svg{display:block;width:1800px;height:1200px;margin:0 0 20px}
  .mono{font-family:"JetBrains Mono",monospace;font-size:22px;letter-spacing:.14em;fill:#9b9797}
  .mono.sm{font-size:18px}
  .mono.ink{fill:#eeecea}
  .mono.acc{fill:#ff6a4f}
  .serif{font-family:Newsreader,serif;font-size:44px;fill:#eeecea}
  .serif.i{font-style:italic;fill:#bab6b6}
  .ln{stroke:#5b5856;stroke-width:2;fill:none}
  .ln.soft{stroke:#3a3a3d}
  .box{fill:#232427;stroke:#5b5856;stroke-width:2}
  .box.paper{fill:#2b2c30}
  .acc{stroke:#ec3013}
  .accf{fill:#ec3013}
  .dash{stroke-dasharray:10 10}
</style></head><body>

<!-- 1 · multi-tenant, one codebase -->

  <path d="M760 300 V900" class="ln"/>
  <!-- tenants -->
  <g id="t">
    <path d="M760 340 H860" class="ln"/>

    <rect x="860" y="280" width="18" height="120" rx="6" fill="#ec3013"/>

    <text x="910" y="372" class="mono sm">default theme · shared logic</text>
  </g>
  <g>
    <path d="M760 520 H860" class="ln"/>

    <text x="910" y="552" class="mono sm">own brand · own domain · same core</text>
  </g>
  <g>
    <path d="M760 700 H860" class="ln"/>

  <g>
    <path d="M760 880 H860" class="ln"/>
    <rect x="860" y="820" width="820" height="120" rx="14" class="box"/>
    <rect x="860" y="820" width="18" height="120" rx="6" fill="#5e7fa8"/>
    <text x="910" y="870" class="mono sm ink">TENANT D · PARTNER API</text>
    <text x="910" y="912" class="mono sm">same models, scoped keys</text>
  </g>
  <text x="120" y="972" class="mono sm">0 forks · 4 tenants · 1 deploy</text>
</svg>

    <rect x="120" y="450" width="300" height="100" rx="50" class="box"/>
    <text x="170" y="510" class="mono sm ink">WRITE THE SPEC</text>

    <rect x="520" y="720" width="340" height="100" rx="50" class="box" stroke="#3a3a3d"/>
    <text x="570" y="780" class="mono sm">ONE GIANT PROMPT</text>
    <line x1="550" y1="770" x2="830" y2="770" stroke="#ec3013" stroke-width="3"/>
    <rect x="900" y="720" width="380" height="100" rx="50" class="box" stroke="#3a3a3d"/>
    <text x="950" y="780" class="mono sm">AGENT WRITES THE SPEC</text>
    <line x1="930" y1="770" x2="1250" y2="770" stroke="#ec3013" stroke-width="3"/>
  </g>
  <text x="120" y="972" class="mono sm">Four-person team · 2025 · the review step is where quality lives</text>
</svg>

<!-- 4 · one React app, 25 regulators -->
<svg id="c4" viewBox="0 0 1800 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="1200" fill="#1a1b1e"/>
  <text x="120" y="290" class="mono">FRONTEND / 04</text>
  <rect x="120" y="470" width="420" height="260" rx="18" class="box"/>
  <rect x="120" y="470" width="420" height="52" rx="18" fill="#2b2c30"/>
  <rect x="120" y="504" width="420" height="18" fill="#2b2c30"/>
  <circle cx="150" cy="496" r="7" class="accf"/>
  <text x="178" y="504" class="mono sm ink">ONE REACT APP</text>
  <text x="152" y="600" class="serif">Same screens.</text>
  <text x="152" y="656" class="serif i">Rules resolved per state.</text>
  <text x="152" y="705" class="mono sm">policy(state) → ui</text>
  <!-- fan -->
  <path d="M540 600 H640" class="ln"/>
  <path d="M640 380 V820" class="ln"/>
  <g class="ln soft">
    <path d="M640 420 H720"/><path d="M640 510 H720"/><path d="M640 600 H720"/><path d="M640 690 H720"/><path d="M640 780 H720"/>
  </g>
  <!-- 5x5 grid -->

    <script xmlns="http://www.w3.org/1999/xhtml">//</script>

<!-- 5 · data tables that survive 10k rows -->
<svg id="c5" viewBox="0 0 1800 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="1200" fill="#1a1b1e"/>
  <text x="120" y="290" class="mono">PERFORMANCE / 05</text>
  <rect x="120" y="360" width="1560" height="600" rx="16" class="box"/>
  <!-- sticky header -->
  <rect x="120" y="360" width="1560" height="64" rx="16" fill="#2b2c30"/>
  <rect x="120" y="400" width="1560" height="24" fill="#2b2c30"/>
  <!-- frozen column shade -->
  <rect x="120" y="424" width="300" height="536" fill="#202124"/>
  <line x1="420" y1="360" x2="420" y2="960" stroke="#5b5856" stroke-width="2"/>
  <g class="mono sm ink">
    <text x="150" y="400">BATCH ID</text><text x="470" y="400">STRAIN</text><text x="820" y="400">THC %</text><text x="1060" y="400">QTY</text><text x="1300" y="400">STATUS</text>
  </g>
  <!-- resize handle on THC col -->
  <line x1="1030" y1="366" x2="1030" y2="418" stroke="#ec3013" stroke-width="3"/>
  <text x="1046" y="352" class="mono sm acc">↔ resize</text>
  <g id="rows"></g>
  <!-- scrollbar -->
  <rect x="1660" y="434" width="8" height="516" rx="4" fill="#2b2c30"/>
  <rect x="1660" y="900" width="8" height="44" rx="4" fill="#ec3013"/>
  <text x="120" y="985" class="mono sm">rows 9,988–10,000 of 10,000 · 60 fps · virtualised, frozen, grouped</text>
</svg>

<!-- 6 · estimating work you have never done -->
<svg id="c6" viewBox="0 0 1800 1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="1200" fill="#1a1b1e"/>
  <text x="120" y="290" class="mono">LEADERSHIP / 06</text>
  <!-- axes -->
  <path d="M160 900 H1640" class="ln"/>
  <path d="M160 360 V900" class="ln"/>
  <!-- cone -->
  <path d="M160 630 C 600 380, 1100 450, 1560 600" class="ln soft dash"/>
  <path d="M160 630 C 600 880, 1100 760, 1560 610" class="ln soft dash"/>
  <path d="M160 630 C 600 380, 1100 450, 1560 600 L1560 610 C 1100 760, 600 880, 160 630 Z" fill="#ec3013" opacity=".08"/>
  <!-- estimate line -->
  <path d="M160 630 L480 600 L820 580 L1180 598 L1560 605" class="ln acc" stroke-width="3"/>
  <g class="accf">
    <circle cx="160" cy="630" r="9"/><circle cx="480" cy="600" r="9"/><circle cx="820" cy="580" r="9"/><circle cx="1180" cy="598" r="9"/><circle cx="1560" cy="605" r="9"/>
  </g>
  <!-- labels -->
  <text x="160" y="950" class="mono sm">DAY 1</text>
  <text x="440" y="950" class="mono sm">SPIKE</text>
  <text x="780" y="950" class="mono sm">FIRST SLICE</text>
  <text x="1120" y="950" class="mono sm">HALFWAY</text>
  <text x="1470" y="950" class="mono sm">SHIPPED</text>
  <text x="190" y="400" class="mono sm">×4 WIDE</text>
  <text x="1300" y="560" class="mono sm acc">re-estimate at every point</text>
  <text x="190" y="720" class="serif i">Pick a range, not a number.</text>
  <text x="190" y="770" class="serif i">Narrow it with evidence.</text>
</svg>

<script>
  // 5x5 state grid for cover 4
  const states = ["CA","WA","OR","CO","MI","NV","AZ","IL","MA","NJ","NY","MD","MO","OH","MT","AK","ME","VT","CT","RI","NM","VA","MN","DE","OK"];
  const g = document.getElementById('grid'); const NS='http://www.w3.org/2000/svg';
  states.forEach((s,i)=>{ const r=Math.floor(i/5), c=i%5; const x=720+c*190, y=376+r*90;
    const rect=document.createElementNS(NS,'rect'); rect.setAttribute('x',x); rect.setAttribute('y',y); rect.setAttribute('width',170); rect.setAttribute('height',70); rect.setAttribute('rx',10);
    const hot = (s==='CA'||s==='WA'); rect.setAttribute('class','box'); if(hot){rect.setAttribute('stroke','#ec3013');}
    g.appendChild(rect);
    const t=document.createElementNS(NS,'text'); t.setAttribute('x',x+24); t.setAttribute('y',y+44); t.setAttribute('class','mono sm '+(hot?'acc':'ink')); t.textContent=s; g.appendChild(t);
    const t2=document.createElementNS(NS,'text'); t2.setAttribute('x',x+86); t2.setAttribute('y',y+44); t2.setAttribute('class','mono sm'); t2.textContent=['METRC','CCRS','BIOTRACK'][i%3]; t2.setAttribute('style','font-size:13px;letter-spacing:.04em'); g.appendChild(t2);
  });
  // rows for cover 5
  const rows=document.getElementById('rows'); const strains=['Adios Apple','Afghan Kush','Butter Cookie','Black Kush #2','Apple Fritter','Blue Dream','Gelato 41','Mac 1','Wedding Cake','Sour Diesel','Runtz','Zkittlez','Jack Herer'];
  for(let i=0;i<13;i++){ const y=424+i*41; const id=9988+i;
    if(i===6){ const hl=document.createElementNS(NS,'rect'); hl.setAttribute('x',121); hl.setAttribute('y',y); hl.setAttribute('width',1538); hl.setAttribute('height',41); hl.setAttribute('fill','#ec3013'); hl.setAttribute('opacity','.14'); rows.appendChild(hl); }
    const ln=document.createElementNS(NS,'line'); ln.setAttribute('x1',120); ln.setAttribute('x2',1680); ln.setAttribute('y1',y+41); ln.setAttribute('y2',y+41); ln.setAttribute('stroke','#2f3033'); ln.setAttribute('stroke-width','1'); rows.appendChild(ln);
    const cells=[[150,'WA-'+id],[470,strains[i]],[820,(18+((i*7)%9)+0.1*(i%4)).toFixed(1)],[1060,String(120+(i*37)%400)],[1300,['IN STOCK','HARVEST','ON HOLD'][i%3]]];
    cells.forEach(([x,v],ci)=>{ const t=document.createElementNS(NS,'text'); t.setAttribute('x',x); t.setAttribute('y',y+28); t.setAttribute('class','mono sm'); t.setAttribute('style','font-size:17px;letter-spacing:.08em'); if(ci===0) t.setAttribute('fill','#bab6b6'); if(i===6) t.setAttribute('fill','#eeecea'); t.textContent=v; rows.appendChild(t); });
  }
</script>
</body></html>
